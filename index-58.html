<!doctype html>
<html lang="es-AR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151b26">
<meta name="description" content="BUSCADOS, la serie. Tres temporadas de una historia de Sebastián Witon.">
<title>BUSCADOS — La serie</title>
<style>
:root{color-scheme:dark;--ink:#f8ecdb;--accent:#efbb75;--rgb:239,187,117;--land:url(./land1.webp);font-family:Georgia,'Times New Roman',serif;background:#151b26;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;isolation:isolate}.landscape{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(180deg,#10162199 0%,transparent 28%,#151b2620 50%,#101621a8 100%),var(--land);background-size:cover;background-position:center 54%}.landscape:after{content:"";position:absolute;inset:0;background:linear-gradient(to right,#151b2640,transparent 35%,transparent 65%,#151b2640)}[hidden]{display:none!important}
a{color:inherit}button,a{-webkit-tap-highlight-color:transparent}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.mast{text-align:center;padding:clamp(24px,5vw,60px) 10px 12px}.wordmark{display:inline-block;text-decoration:none;font-size:clamp(3rem,12vw,8rem);line-height:.85;letter-spacing:.025em;text-shadow:0 3px 28px #0009}.wordmark span{display:block;font-size:clamp(.85rem,2.7vw,1.45rem);letter-spacing:.55em;padding:.75em 0 .35em .55em}.mast nav{display:flex;justify-content:center;gap:clamp(4px,4vw,36px);margin-top:18px}.mast nav a{padding:10px 8px 8px;text-transform:uppercase;font-size:clamp(.72rem,2.8vw,.95rem);letter-spacing:.12em;text-decoration:none;border-bottom:2px solid transparent}.mast nav a[aria-current]{border-color:var(--accent);box-shadow:0 7px 10px -9px var(--accent)}
#catalog,#reader{max-width:840px;margin:auto;padding:0 18px}.intro{text-align:center;text-shadow:0 2px 15px #000,0 2px 5px #000}.intro h1{font-size:clamp(1.5rem,5vw,2.6rem);letter-spacing:.18em;text-transform:uppercase;margin:18px 0 5px}.intro p{font-size:1.15rem;font-style:italic;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px clamp(8px,4vw,40px);max-width:690px;margin:auto}.grid.odd .crystal:last-child{grid-column:1/-1;width:calc((100% - clamp(8px,4vw,40px))/2);justify-self:center}
.crystal{position:relative;min-height:clamp(116px,24vw,190px);display:grid;place-items:center;text-align:center;text-decoration:none;filter:drop-shadow(0 9px 9px #070a10ad);transition:transform .38s ease,filter .38s ease;transform:rotate(var(--tilt))}.crystal svg,.crystal .glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.crystal .glass{object-fit:fill;filter:drop-shadow(0 0 6px rgba(var(--rgb),.55))}.crystal .gemtext{position:relative;display:grid;gap:5px;width:79%;justify-items:center;text-shadow:0 2px 6px #000,0 0 12px #000}.number{font-size:clamp(2.5rem,8vw,4.9rem);line-height:.9}.name{font-size:clamp(.74rem,2.6vw,.99rem);line-height:1.15}.crystal:is(:hover,:focus-visible){transform:translateY(-7px) rotate(0) scale(1.035);filter:drop-shadow(0 4px 15px rgba(var(--rgb),.68))}.crystal:active{transform:scale(.97)}
.readbar,.readend{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.readbar{margin-top:18px}.pill{display:inline-block;padding:10px 15px;border-radius:99px;background:#14181eea;border:1px solid #dbbe8e6b;text-decoration:none;font-size:.94rem}.pill:hover{border-color:var(--accent)}.paper{margin:14px auto 20px;background:#151920f2;border:1px solid #dfc4914d;border-radius:17px;padding:clamp(20px,6vw,66px);box-shadow:0 18px 65px #0007;overflow:hidden}.eyebrow{font:600 .81rem system-ui,sans-serif;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}.paper h1{font-size:clamp(2rem,7vw,3.85rem);line-height:1.04;margin:.25em 0 .48em}.script{max-width:62ch;margin:auto;font-size:clamp(1.08rem,3.3vw,1.25rem);line-height:1.65}.script p{margin:.72em 0;overflow-wrap:break-word}.script .time{color:var(--accent);margin-top:2.1em;font:600 .84rem system-ui,sans-serif;letter-spacing:.08em}.script .scene{font-weight:bold}.script .speaker{color:var(--accent);text-align:center;font:600 .92rem system-ui,sans-serif;letter-spacing:.07em;margin-bottom:.1em}.script .speech{margin:.12em 0 .9em;padding-inline:clamp(20px,8vw,83px)}figure{margin:1.5em 0}figure img{width:100%;height:auto;border-radius:8px;display:block}.readend{border-top:1px solid #dfc4914d;padding-top:20px;margin-top:36px}footer{text-align:center;font-style:italic;padding:30px 12px 36px;text-shadow:0 1px 8px #000}.arrive{animation:arrive .65s cubic-bezier(.19,.68,.28,1) both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.veil{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,rgba(var(--rgb),.23),transparent 66%);animation:veil .68s ease-out both}@keyframes veil{0%,100%{opacity:0}28%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
[data-season="2"] .crystal .glass{filter:hue-rotate(153deg) saturate(.7) drop-shadow(0 0 6px #9ce2f066)}[data-season="3"] .crystal .glass{filter:hue-rotate(-14deg) saturate(1.2) drop-shadow(0 0 6px #ffae7366)}.crystal:hover .glass,.crystal:focus-visible .glass{opacity:1}.glass{opacity:.91}.paper{background:linear-gradient(145deg,#151920d9,#151920ef 38%,#151920f6)} 

@media(max-width:420px){.mast nav{gap:3px}.mast nav a{padding-inline:5px;font-size:clamp(.63rem,2.65vw,.85rem);letter-spacing:.07em;white-space:nowrap}}
</style>
<header class="mast">
 <a class="wordmark" href="#temporada/1" aria-label="Buscados, inicio">BUSCADOS<span>LA SERIE</span></a>
 <nav aria-label="Temporadas" id="seasons"></nav>
</header>
<div class="landscape" aria-hidden="true"></div>
<main id="catalog"></main>
<main id="reader" hidden></main>
<footer>Una historia de Sebastián Witon</footer>
<noscript>Activá JavaScript para abrir los capítulos.</noscript>
<script src="./chapters.js"></script>
<script>
for (const season of window.BUSCADOS) for (const chapter of season) for (const block of chapter.blocks) {
 if(block[0]==='image' && /^assets\/[\w-]+\.webp$/.test(block[1])) block[1]='./'+block[1].slice(7);
}
'use strict';
const story=window.BUSCADOS;
const seasons=[
 {name:'Cronos',color:'#efbb75',rgb:'239,187,117'},
 {name:'La montaña',color:'#9ce2f0',rgb:'156,226,240'},
 {name:'Campo Grande',color:'#ffae73',rgb:'255,174,115'}
];
const get=id=>document.getElementById(id);
const scene=get('catalog'),reader=get('reader'),tabs=get('seasons');
const pad=n=>String(n).padStart(2,'0');
const seasonLink=s=>'#temporada/'+s;
const chapterLink=(s,c)=>seasonLink(s)+'/capitulo/'+c;
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function link(href,txt,cls=''){const a=el('a',cls,txt);a.href=href;return a;}
function render({animate=true}={}){
 const m=location.hash.match(/^#temporada\/([1-3])(?:\/capitulo\/(\d+))?$/);
 const s=m?Number(m[1]):1, cs=story[s-1], c=m?Number(m[2]):0, book=cs[c-1], season=seasons[s-1];
 const root=document.documentElement;root.dataset.season=s;
 root.style.setProperty('--accent',season.color);root.style.setProperty('--rgb',season.rgb);root.style.setProperty('--land','url("./land'+s+'.webp")');
 tabs.replaceChildren(...seasons.map((_,i)=>{const a=link(seasonLink(i+1),'Temporada '+(i+1));if(i+1===s)a.setAttribute('aria-current','true');return a;}));
 scene.hidden=!!book;reader.hidden=!book;
 if(!book){
  reader.replaceChildren();
  const intro=el('section','intro');intro.append(el('h1','',season.name),el('p','','Elegí un capítulo'));
  const grid=el('div','grid'+(cs.length%2?' odd':''));
  cs.forEach((ep,i)=>{const a=link(chapterLink(s,i+1),'','crystal');a.setAttribute('aria-label','Capítulo '+(i+1)+': '+ep.title);
   a.style.setProperty('--tilt',[ '-2deg','1.5deg','1deg','-1.5deg'][i%4]);
   const gem=el('img','glass');gem.src='./crystal.webp';gem.alt='';gem.decoding='async';a.append(gem);
   const label=el('span','gemtext');label.append(el('span','number',pad(i+1)),el('span','name',ep.title));a.append(label);grid.append(a);
  });scene.replaceChildren(intro,grid);document.title='BUSCADOS · Temporada '+s;
 } else {
  const top=el('nav','readbar');top.setAttribute('aria-label','Volver a capítulos');top.append(link(seasonLink(s),'Volver a los capítulos','pill'));
  const paper=el('article','paper');paper.append(el('div','eyebrow','Temporada '+s+' · Capítulo '+pad(c)));
  const title=el('h1','',book.title);title.tabIndex=-1;paper.append(title);
  const script=el('div','script');
  for(const [kind,value] of book.blocks){
   if(kind==='image'){const fig=el('figure');const img=el('img');img.src=value;img.alt='Ilustración del capítulo '+c;img.loading='lazy';img.decoding='async';fig.append(img);script.append(fig);}
   else script.append(el('p',kind,value));
  }
  const end=el('nav','readend');end.setAttribute('aria-label','Continuar leyendo');
  end.append(c>1?link(chapterLink(s,c-1),'Capítulo anterior','pill'):link(seasonLink(s),'Ver capítulos','pill'));
  end.append(c<cs.length?link(chapterLink(s,c+1),'Próximo capítulo','pill'):s<3?link(seasonLink(s+1),'Temporada '+(s+1),'pill'):link(seasonLink(s),'Volver a Campo Grande','pill'));
  paper.append(script,end);reader.replaceChildren(top,paper);document.title=book.title+' · BUSCADOS';
  if(animate)title.focus({preventScroll:true});
 }
 const target=book?reader:scene;
 if(animate){
  window.scrollTo(0,0);
  target.classList.remove('arrive');void target.offsetWidth;target.classList.add('arrive');
  if(book&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
   const v=el('div','veil');v.setAttribute('aria-hidden','true');document.body.append(v);setTimeout(()=>v.remove(),700);
  }
 }
}
window.addEventListener('hashchange',()=>render());
render({animate:false});

</script>
</html>
